[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relu-rlct"
version = "0.1.0"
description = "Exact local learning coefficient certificates for shallow ReLU networks on finite data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Arturs Berzins"}]
dependencies = ["sympy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]
